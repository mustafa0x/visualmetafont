name: Experimental native runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer prerelease version, for example 0.2.0-rc.1
        required: true
        type: string
      publish_release:
        description: Publish an immutable prerelease after all artifact checks pass
        required: true
        default: false
        type: boolean

concurrency:
  group: experimental-native-runtime-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime dependency
        run: git submodule update --init lib/harfbuzz/harfbuzz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.28.3 ninja==1.11.1.1
      - name: Validate version and native runtime
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^0\.2\.0-[0-9A-Za-z.-]+$ ]] || {
            echo "::error::The experimental runtime must use a 0.2.0 prerelease version"
            exit 1
          }
          echo 'b816044399d3d2e1c0cef8245a3be997d1d3c48d35486f0448d2473d7e81b132  examples/testvarfont/digitalkhatt-cff2.otf' | sha256sum --check
          cmake -S lib/digitalkhatt/runtime -B build/native-runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-runtime --parallel
          ctest --test-dir build/native-runtime --output-on-failure
          python scripts/package-native-source.py "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-source
          if-no-files-found: error
          path: dist/native-runtime

  android:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime dependency
        run: git submodule update --init lib/harfbuzz/harfbuzz
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake and Ninja
        run: |
          python -m pip install cmake==3.28.3 ninja==1.11.1.1
          mkdir -p .tools/android-cmake/bin
          ln -s "$(command -v cmake)" .tools/android-cmake/bin/cmake
          ln -s "$(command -v ninja)" .tools/android-cmake/bin/ninja
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'ndk;27.1.12297006'
          printf 'sdk.dir=%s\ncmake.dir=%s\n' \
            "$ANDROID_HOME" "$GITHUB_WORKSPACE/.tools/android-cmake" \
            > packages/android/local.properties
      - name: Build and verify Android Prefab AAR
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          scripts/package-native-android.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-android
          if-no-files-found: error
          path: dist/native-runtime

  apple:
    needs: source
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime dependency
        run: git submodule update --init lib/harfbuzz/harfbuzz
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.28.3 ninja==1.11.1.1
      - name: Build and verify Apple XCFramework
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/package-native-apple.py "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-apple
          if-no-files-found: error
          path: dist/native-runtime

  release:
    if: ${{ inputs.publish_release }}
    needs: [source, android, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-runtime-*
          path: release-assets
          merge-multiple: true
      - name: Complete release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp packages/licenses/LICENSE-AGPL-3.0 release-assets/
          cp packages/licenses/ANDROID-NDK-LLVM-NOTICE release-assets/
          cp packages/licenses/HARFBUZZ-COPYING release-assets/
          cp packages/licenses/PCRE2-LICENCE.md release-assets/
          cp packages/licenses/THIRD-PARTY-NOTICES.md release-assets/
          python scripts/write-native-release-manifest.py "$VERSION" release-assets
      - name: Publish immutable experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="native-runtime-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; native runtime releases are immutable"
            exit 1
          fi
          cat > release-notes.md <<EOF
          Experimental DigitalKhatt native runtime $VERSION

          This AGPL-3.0-or-later runtime is published for development and evaluation only. It is not approved for production distribution in Muhaffidh. Android and Apple artifacts expose ABI v1 and require an external compatible DigitalKhatt font.

          See manifest.json and THIRD-PARTY-NOTICES.md for exact source revisions, checksums, and licenses.
          EOF
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "DigitalKhatt experimental native runtime $VERSION" \
            --notes-file release-notes.md \
            --prerelease
